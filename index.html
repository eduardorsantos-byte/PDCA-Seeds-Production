:root{--deep:#0A0B0A;--panel:#141614;--line:#262A26;--bright:#00C65E;--muted:#9BA39A;--alert:#FF8A65;--white:#fff;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--white);font-family:'Figtree',system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:26px}
.box svg{height:24px;width:auto;align-self:flex-start}
h1{font-size:28px;font-weight:700;line-height:1.15;margin:0}
h1 span{color:var(--bright)}
p{margin:0;color:var(--muted);font-size:14px}
form{display:flex;flex-direction:column;gap:14px;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--panel)}
label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{font:inherit;font-size:15px;text-transform:none;letter-spacing:0;color:var(--white);background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
input:focus{outline:none;border-color:var(--bright)}
button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;padding:12px;background:var(--bright);color:var(--deep);cursor:pointer;margin-top:4px}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--white);outline-offset:2px}
.err{color:var(--alert);font-size:13.5px;font-weight:600}
small{color:var(--muted);font-size:12px}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const err=m=>{const e=document.getElementById('err');e.textContent=m;e.hidden=!m};
async function openWith(raw){
  const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IVC)},k,u8(CT)));
  const d=new DOMParser().parseFromString(html,'text/html');
  const lc=document.getElementById('loginCss');if(lc)lc.remove();
  const tt=d.title||document.title;
  d.head.querySelectorAll('style').forEach(n=>document.head.appendChild(document.importNode(n,true)));
  document.body.replaceChildren(...[...d.body.childNodes].map(n=>document.importNode(n,true)));
  document.body.querySelectorAll('script').forEach(o=>{const n=document.createElement('script');n.textContent=o.textContent;o.replaceWith(n)});
  document.title=tt;
}
async function login(email,pw){
  const e=email.trim().toLowerCase(),h=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(e)));
  const rec=KEYS[h];if(!rec)throw new Error('x');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(e+'\n'+pw),'PBKDF2',false,['deriveKey']);
  const dk=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(rec.iv)},dk,u8(rec.w));
  try{sessionStorage.setItem('pdca_user',e);sessionStorage.setItem('pdca_k',btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(x){}
  await openWith(raw);
}
(async()=>{
  if(!(window.crypto&&crypto.subtle)){err('Este navegador não abre o arquivo. Use o Chrome ou o Edge atualizado.');document.getElementById('go').disabled=true;return}
